name: SOPT Push Notification CD (SAM Deploy)

on:
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy-dev:
    name: Deploy to AWS (dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Deployable JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Write params-dev.json from Secrets
        run: printf '%s' '${{ secrets.PARAMS_DEV_JSON }}' > params-dev.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install SAM CLI
        run: pip install aws-sam-cli==1.149.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (dev)
        run: |
          PARAMS=$(jq -r 'to_entries | map("\(.key)=\(.value)") | join(" ")' params-dev.json)
          
          sam deploy \
            --stack-name sopt-push-dev \
            --template-file template.yaml \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-confirm-changeset


  deploy-prod:
    name: Deploy to AWS (prod)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Deployable JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Write params-prod.json from Secrets
        run: printf '%s' '${{ secrets.PARAMS_PROD_JSON }}' > params-prod.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install SAM CLI
        run: pip install aws-sam-cli==1.149.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (prod)
        run: |
          PARAMS=$(jq -r 'to_entries | map("\(.key)=\(.value)") | join(" ")' params-prod.json)
          
          sam deploy \
            --stack-name sopt-push-prod \
            --template-file template.yaml \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-confirm-changeset

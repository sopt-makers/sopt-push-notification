name: SOPT Push Notification CD (SAM Deploy)

on:
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:

  deploy-dev:
    name: Deploy to AWS (dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Lambda Artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: build/libs/

      - name: Write params-dev.json from Secrets
        run: |
          echo '${{ secrets.PARAMS_DEV_JSON }}' > params-dev.json
          cat params-dev.json

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (dev)
        run: |
          PARAMS=$(cat params-dev.json | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]')

          sam deploy \
            --stack-name sopt-push-dev \
            --template-file template.yaml \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-confirm-changeset


  deploy-prod:
    name: Deploy to AWS (prod)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Lambda Artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: build/libs/

      - name: Write params-prod.json from Secrets
        run: |
          echo '${{ secrets.PARAMS_PROD_JSON }}' > params-prod.json
          cat params-prod.json

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Deploy (prod)
        run: |
          PARAMS=$(cat params-prod.json | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]')

          sam deploy \
            --stack-name sopt-push-prod \
            --template-file template.yaml \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-confirm-changeset

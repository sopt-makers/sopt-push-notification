name: SOPT Push Notification Server Deploy to AWS Lambda

on:
  push:
    branches:
      - prod
      - develop
  workflow_dispatch:  # 수동 실행 가능

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build shadowJar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: build/libs/app.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stage: dev
            branch: develop
          - stage: prod
            branch: prod
    if: github.ref_name == matrix.branch
    environment:
      name: ${{ matrix.stage == 'dev' && 'dev' || 'prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: build/libs/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-serverless-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-serverless-

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create .env file
        env:
          ENV_FILE: ${{ matrix.stage == 'dev' && secrets.ENV_DEV || secrets.ENV_PROD }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          serverless deploy --stage ${{ matrix.stage }} --verbose | tee deploy.log
          # Extract endpoint from deploy output or serverless info
          ENDPOINT=$(grep -oP 'endpoints:\s*\K[^\s]+' deploy.log 2>/dev/null || \
                     serverless info --stage ${{ matrix.stage }} 2>/dev/null | grep -oP 'endpoints:\s*\K[^\s]+' || \
                     echo "")
          if [ -n "$ENDPOINT" ]; then
            echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
            echo "Deployment endpoint: $ENDPOINT"
          fi

      - name: Set deployment URL
        if: steps.deploy.outputs.endpoint != ''
        run: |
          echo "::notice::Deployment endpoint: ${{ steps.deploy.outputs.endpoint }}"

